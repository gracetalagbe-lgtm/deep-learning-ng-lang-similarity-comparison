# =============================================================================
# Global project configuration
# =============================================================================
# All hyperparameters live here or in configs/models/*.yaml - nothing is
# hardcoded in the source code. Every experiment run must record the config
# snapshot it used (see src/afripara/config.py).

project:
  name: afripara
  seed: 42
  description: >
    Transformer-based semantic similarity and paraphrase detection for
    Yoruba (yor), Igbo (ibo) and Hausa (hau). MSc research project.

languages:
  codes: [yor, ibo, hau]
  notes: >
    Language metadata of all data is validated in Phase 2 with AfroLID
    (Apache-2.0). mBERT is NOT a valid model for ibo/hau (absent from its
    104-language pretraining set); it is used only as a control (see
    configs/models/mbert.yaml).

paths:
  data_raw: data/raw              # immutable originals, as downloaded
  data_external: data/external    # third-party resources we did not download
  data_interim: data/interim      # audit reports, caches, intermediate files
  data_processed: data/processed  # final modelling-ready datasets (splits)
  checkpoints: checkpoints        # model checkpoints (Colab: Google Drive)
  outputs: outputs                # metrics, figures, evaluation reports

preprocessing:
  # Diacritics in Yoruba are phonemic (tone marks distinguish words), so the
  # default pipeline MUST preserve them. Stripping is an experimental
  # condition of the linguistic study (E6), never a default.
  unicode_normalform: NFC   # canonical composition; preserves diacritics
  lowercase: false
  strip_diacritics: false   # only set true inside E6 ablation configs

training:
  # Defaults follow Devlin et al. (2019) / XLM-R practice and fit a free
  # Colab T4 (16 GB). Justification: docs/feasibility_report.md section 8.
  learning_rate: 2.0e-5
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 2   # effective batch 32
  num_train_epochs: 5
  warmup_ratio: 0.1                # 10% linear warmup
  weight_decay: 0.01
  max_seq_length: 128
  fp16: true                       # ignored automatically on CPU-only runs
  early_stopping_patience: 3       # epochs without validation-F1 improvement
  metric_for_best_model: eval_f1
  n_seeds: 3                       # report mean +/- std over seeds
  lr_grid: [1.0e-5, 2.0e-5, 3.0e-5]  # swept on validation data only

evaluation:
  classification_metrics: [accuracy, precision, recall, f1, roc_auc]
  similarity_metrics: [spearman, pearson]
  significance:
    mcnemar: true
    paired_bootstrap_resamples: 10000
    bootstrap_ci: 0.95
  # Calibration for the demo UI only (temperature scaling on validation);
  # Spearman/Pearson are invariant to monotone transforms.
  temperature_calibration: true

construction:
  salt: afripara-v1          # hash salt for deterministic sentence-disjoint splits
  split_weights:
    train: 0.8
    dev: 0.1
    test: 0.1
  paws_train_target_pairs:   # constructed pairs per language (translate-train)
    yor: 3000
    ibo: 3000
    hau: 1500                # Hausa also has 2,551 human-labelled SemRel pairs
  max_pair_chars: 200        # prefer shorter PAWS pairs for MT quality/cost
  max_len_ratio: 3.0         # MT QC: drop pairs with extreme length mismatch
  gold_annotation_target:
    yor: 400                 # native-speaker (researcher) validated subset
  mt_vs_human_target:        # supplementary candidate positives (en source -> MT vs human)
    yor: 1000                # from Menyo-20k English sources
    ibo: 1000                # from IGBONLP English sources
  mt_model: facebook/nllb-200-distilled-600M

logging:
  level: INFO
